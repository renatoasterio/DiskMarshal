name: Bug report
description: Something does not work as the documentation says. Pode escrever em português.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Terminal output
      description: Paste the full message, if there was one. Remove anything private, such as folder names.
      render: text
  - type: input
    id: macos
    attributes:
      label: macOS version
      description: Apple menu, About This Mac.
      placeholder: "27.2"
    validations:
      required: true
  - type: dropdown
    id: chip
    attributes:
      label: Mac type
      options:
        - Apple Silicon
        - Intel
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: DiskMarshal version
      description: Run `git rev-parse --short HEAD` in the project folder.
      placeholder: 96fdc4d

name: Idea or request
description: Suggest something DiskMarshal should do. Pode escrever em português.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How could DiskMarshal help? A sketch or an example is welcome.
  - type: checkboxes
    id: safety
    attributes:
      label: Safety
      options:
        - label: This idea does not require deleting anything without a preview and a confirmation.

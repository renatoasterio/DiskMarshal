[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]

# Single source of truth: every crate inherits these with `key.workspace = true`.
[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/renatoasterio/MacCleaner"
# Distributed from GitHub, not from crates.io.
publish = false

[workspace.dependencies]
# Internal crates
maccleaner-domain = { path = "crates/maccleaner-domain" }
maccleaner-application = { path = "crates/maccleaner-application" }
maccleaner-infrastructure = { path = "crates/maccleaner-infrastructure" }
maccleaner-test-support = { path = "crates/maccleaner-test-support" }
maccleaner-ui = { path = "crates/maccleaner-ui" }

# Third-party crates (minimal features)
anyhow = "1.0"
blake3 = "1.8"
# No `default_fonts`: the interface embeds its own typefaces (assets/fonts).
eframe = { version = "0.37", default-features = false, features = ["accesskit", "wgpu"] }
egui = { version = "0.37", default-features = false }
clap = { version = "4.6", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
libc = "0.2.191"
# No `serde`: only the dynamic `Value` is read, from `Info.plist`.
plist = { version = "1.10", default-features = false }
rayon = "1.12"
rfd = { version = "0.18", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = { version = "0.40", default-features = false, features = ["component", "system"] }
tempfile = "3.27"
thiserror = "2.0"
toml = { version = "1.0", default-features = false, features = ["parse", "serde"] }
trash = { version = "5.4", default-features = false }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
expect_used = "deny"
explicit_iter_loop = "warn"
manual_let_else = "warn"
match_same_arms = "warn"
needless_pass_by_value = "warn"
panic = "deny"
redundant_closure_for_method_calls = "warn"
semicolon_if_nothing_returned = "warn"
todo = "deny"
undocumented_unsafe_blocks = "deny"
uninlined_format_args = "warn"
unwrap_used = "deny"

# Keep debug builds small: this project exists because disk space is scarce.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

# Catalog of what DiskMarshal knows how to clean.
#
# A rule removes the CONTENT of its folders, never the folders themselves.
# `~` is the user's home folder and `$TMPDIR` is the user's temporary folder.
# No folder may be inside the folder of another rule: it would be counted twice.
#
#   risk    safe      recreated automatically; selected by default
#           review    may be worth keeping; never selected by default
#   scope   user      the logged-in user can remove it
#           administrator   macOS must authenticate an administrator first
#   method  permanent removed at once
#           trash     moved to the Trash

[[rule]]
id = "app-caches"
name = "Caches de aplicativos"
description = "~/Library/Caches · recriados pelos apps quando precisam"
locations = ["~/Library/Caches"]
risk = "safe"
scope = "user"
method = "permanent"

[[rule]]
id = "temporary-files"
name = "Arquivos temporários"
description = "Pasta temporária do usuário · só itens parados há mais de 7 dias"
locations = ["$TMPDIR"]
risk = "safe"
scope = "user"
method = "permanent"
minimum_age_days = 7

[[rule]]
id = "logs"
name = "Logs e relatórios de falha"
description = "~/Library/Logs"
locations = ["~/Library/Logs"]
risk = "safe"
scope = "user"
method = "permanent"

[[rule]]
id = "trash"
name = "Lixeira"
description = "Esvazia a Lixeira · sem volta · exige Acesso Total ao Disco"
locations = ["~/.Trash"]
# Never selected for the user: emptying the Trash cannot be undone, and the
# Trash is where DiskMarshal itself sends duplicates and photos.
risk = "review"
scope = "user"
method = "permanent"

[[rule]]
id = "xcode-derived-data"
name = "Xcode DerivedData"
description = "Resultado de compilações · recriado no próximo build"
locations = ["~/Library/Developer/Xcode/DerivedData"]
risk = "safe"
scope = "user"
method = "permanent"

[[rule]]
id = "simulator-caches"
name = "Caches do simulador"
description = "~/Library/Developer/CoreSimulator/Caches"
locations = ["~/Library/Developer/CoreSimulator/Caches"]
risk = "safe"
scope = "user"
method = "permanent"

[[rule]]
id = "xcode-device-support"
name = "Suporte a dispositivos do Xcode"
description = "Símbolos de depuração de iPhones e iPads · baixados de novo ao conectar o aparelho"
locations = ["~/Library/Developer/Xcode/iOS DeviceSupport"]
risk = "review"
scope = "user"
method = "permanent"

[[rule]]
id = "xcode-archives"
name = "Xcode Archives"
description = "Builds enviados à App Store · vão para a Lixeira"
locations = ["~/Library/Developer/Xcode/Archives"]
risk = "review"
scope = "user"
method = "trash"

[[rule]]
id = "package-manager-caches"
name = "Caches de gerenciadores de pacotes"
description = "npm, cargo, Gradle, NuGet e pnpm · baixados de novo quando necessário"
locations = [
    "~/.npm/_cacache",
    "~/.cargo/registry/cache",
    "~/.cargo/registry/src",
    "~/.gradle/caches",
    "~/.nuget/packages",
    "~/Library/pnpm/store",
]
risk = "safe"
scope = "user"
method = "permanent"

[[rule]]
id = "system-caches"
name = "Caches do sistema"
description = "/Library/Caches"
locations = ["/Library/Caches"]
risk = "safe"
scope = "administrator"
method = "permanent"

[[rule]]
id = "system-logs"
name = "Logs do sistema"
description = "/Library/Logs"
locations = ["/Library/Logs"]
risk = "safe"
scope = "administrator"
method = "permanent"

<meta charset="utf-8">
<title>Protótipo MacCleaner</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Rajdhani:wght@500;600;700&display=swap">
<style>
/* Layout: ops console. Status bar on top, module rail at left, one working stage.
   Appearance controls (palette, motion, glow) open from the sliders icon in the status bar.
   Token names mirror crates/maccleaner-ui/src/theme/tokens.rs one to one. */
:root {
  color-scheme: dark;
  --color-surface-void: #04070a;
  --color-surface-window: #070c10;
  --color-surface-panel: #0a1319;
  --color-surface-raised: #0f1c24;
  --color-line: #173039;
  --color-line-strong: #24505e;
  --color-text-primary: #d5eef3;
  --color-text-secondary: #84a7b1;
  --color-text-muted: #56727b;
  --color-accent: #2fe6ff;
  --color-accent-rgb: 47 230 255;
  --color-accent-contrast: #021317;
  --color-ok: #45f0a0;
  --color-warn: #ffb020;
  --color-alert: #ff4d5a;
  --color-category-system: #7d95a0;
  --color-category-code: #4aa8ff;
  --color-category-photo: #ff6fb0;
  --color-category-video: #ffb020;
  --color-category-document: #45f0a0;
  --color-category-download: #a98bff;
  --font-display: "Rajdhani", "Avenir Next Condensed", "Helvetica Neue", sans-serif;
  --font-data: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --glow-strength: 1;
  --motion-sweep-duration: 4s;
  --motion-boot-duration: 1.6s;
  --motion-enter-duration: .35s;
  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-5: 24px;
  --corner-size: 10px;
}
:root[data-palette="terminal"] {
  --color-surface-void: #030703; --color-surface-window: #050b06; --color-surface-panel: #08130a;
  --color-surface-raised: #0d1d11; --color-line: #153019; --color-line-strong: #22592d;
  --color-text-primary: #d3f5d9; --color-text-secondary: #84b08e; --color-text-muted: #55775d;
  --color-accent: #3dff7a; --color-accent-rgb: 61 255 122; --color-accent-contrast: #021505;
  --color-ok: #c8ff70;
}
:root[data-palette="tactical"] {
  --color-surface-void: #080603; --color-surface-window: #0c0905; --color-surface-panel: #141008;
  --color-surface-raised: #1e180c; --color-line: #33290f; --color-line-strong: #5c4a1a;
  --color-text-primary: #f5ead3; --color-text-secondary: #b3a27c; --color-text-muted: #7a6d50;
  --color-accent: #ffb000; --color-accent-rgb: 255 176 0; --color-accent-contrast: #1a1000;
  --color-warn: #ff7a1a;
}
*, *::before, *::after { box-sizing: border-box; }
body {
  background: var(--color-surface-void); color: var(--color-text-primary);
  font-family: var(--font-data); font-size: 13px; line-height: 1.45;
  padding-block: var(--space-4);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }
.page { max-width: 1132px; margin: 0 auto; display: flex; flex-direction: column; gap: var(--space-3); }

[hidden] { display: none !important; }

/* Appearance controls */
.control-group { display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap; }
.control-label { color: var(--color-text-muted); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; }
.chip { background: transparent; border: 1px solid var(--color-line-strong); color: var(--color-text-secondary); padding: 4px 10px; font-size: 12px; }
.chip[aria-pressed="true"] { border-color: var(--color-accent); color: var(--color-accent); background: rgb(var(--color-accent-rgb) / .1); }
.window-scroller { overflow-x: auto; }

/* App window */
.window {
  position: relative; width: 1100px; height: 720px; background: var(--color-surface-window);
  border: 1px solid var(--color-line-strong); display: grid; grid-template: 36px 1fr / 216px 1fr; overflow: hidden;
}
.window::after { content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 40;
  background: repeating-linear-gradient(0deg, rgb(var(--color-accent-rgb) / .03) 0 1px, transparent 1px 3px); }
.scan-band { position: absolute; left: 0; right: 0; height: 90px; pointer-events: none; z-index: 41;
  background: linear-gradient(180deg, transparent, rgb(var(--color-accent-rgb) / .05), transparent);
  animation: band 7s linear infinite; }
@keyframes band { from { transform: translateY(-90px); } to { transform: translateY(720px); } }

.status-bar { grid-column: 1 / -1; display: flex; align-items: center; gap: var(--space-4); padding: 0 var(--space-3);
  border-bottom: 1px solid var(--color-line); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--color-text-secondary); }
.brand { font: 700 15px/1 var(--font-display); letter-spacing: .18em; color: var(--color-accent);
  text-shadow: 0 0 calc(8px * var(--glow-strength)) rgb(var(--color-accent-rgb) / .6); }
.status-item { display: flex; align-items: center; gap: 6px; }
.dot { width: 6px; height: 6px; background: var(--color-ok); box-shadow: 0 0 calc(6px * var(--glow-strength)) var(--color-ok); }
.dot.warn { background: var(--color-warn); box-shadow: 0 0 calc(6px * var(--glow-strength)) var(--color-warn); animation: blink 1.6s steps(2) infinite; }
@keyframes blink { 50% { opacity: .25; } }
.status-bar .spacer { flex: 1; }
.status-link { background: none; border: 0; padding: 0; letter-spacing: inherit; text-transform: inherit; color: var(--color-warn); }
.icon-btn { background: none; border: 1px solid var(--color-line-strong); color: var(--color-text-secondary); width: 24px; height: 24px; display: grid; place-items: center; padding: 0; }
.icon-btn svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.6; }
.icon-btn:hover, .icon-btn[aria-expanded="true"] { color: var(--color-accent); border-color: var(--color-accent);
  box-shadow: 0 0 calc(6px * var(--glow-strength)) rgb(var(--color-accent-rgb) / .5); }
.hud-panel.settings-panel { position: absolute; top: 44px; right: 10px; z-index: 35; width: 380px; background: var(--color-surface-window);
  display: flex; flex-direction: column; gap: var(--space-3); animation: enter .2s ease-out; }
.settings-row { display: flex; flex-direction: column; gap: 6px; }
.settings-row input[type="range"] { width: 100%; accent-color: var(--color-accent); }
.swatch { display: inline-block; width: 8px; height: 8px; margin-right: 6px; }

.rail { border-right: 1px solid var(--color-line); display: flex; flex-direction: column; padding: var(--space-3) 0; position: relative; }
.rail-item { position: relative; display: grid; grid-template-columns: 18px 1fr auto; align-items: center; gap: var(--space-3);
  background: none; border: 0; text-align: left; padding: 9px var(--space-4); color: var(--color-text-secondary);
  font: 600 14px/1 var(--font-display); letter-spacing: .08em; text-transform: uppercase; white-space: nowrap; }
.rail-item svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.5; }
.rail-item kbd { font: 400 10px var(--font-data); color: var(--color-text-muted); border: 1px solid var(--color-line); padding: 1px 4px; }
.rail-item:hover { color: var(--color-text-primary); }
.rail-item[aria-current="page"] { color: var(--color-accent); background: linear-gradient(90deg, rgb(var(--color-accent-rgb) / .14), transparent); }
.rail-marker { position: absolute; left: 0; width: 3px; height: 36px; background: var(--color-accent);
  box-shadow: 0 0 calc(10px * var(--glow-strength)) var(--color-accent); transition: transform var(--motion-enter-duration) cubic-bezier(.2,.8,.2,1); }
.rail-foot { margin-top: auto; padding: var(--space-3) var(--space-4) 0; border-top: 1px solid var(--color-line); font-size: 11px; color: var(--color-text-secondary); }
.rail-foot strong { color: var(--color-warn); font-weight: 500; }

.stage { position: relative; overflow-y: auto; padding: var(--space-4) var(--space-5); display: flex; flex-direction: column; gap: var(--space-3); }
.stage::before { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .28;
  background-image: linear-gradient(var(--color-line) 1px, transparent 1px), linear-gradient(90deg, var(--color-line) 1px, transparent 1px);
  background-size: 40px 40px; }
.stage > * { position: relative; }
.stage-head { display: flex; align-items: flex-end; gap: var(--space-4); }
.stage-title { font: 700 26px/1 var(--font-display); letter-spacing: .14em; text-transform: uppercase; margin: 0; min-height: 26px;
  text-shadow: 0 0 calc(10px * var(--glow-strength)) rgb(var(--color-accent-rgb) / .35); }
.stage-title::after { content: "_"; color: var(--color-accent); animation: blink 1s steps(2) infinite; }
.stage-sub { color: var(--color-text-secondary); font-size: 12px; margin: 4px 0 0; }
.stage-head .grow { flex: 1; min-width: 0; }
.screen { display: flex; flex-direction: column; gap: var(--space-3); flex: 1; min-height: 0; animation: enter var(--motion-enter-duration) ease-out; }
@keyframes enter { from { opacity: 0; transform: translateY(6px); } }

/* Shared components */
.hud-panel { position: relative; background: var(--color-surface-panel); border: 1px solid var(--color-line); padding: var(--space-3); min-width: 0; }
.hud-panel::before, .hud-panel::after { content: ""; position: absolute; width: var(--corner-size); height: var(--corner-size);
  border: 1px solid var(--color-accent); pointer-events: none; }
.hud-panel::before { top: -1px; left: -1px; border-right: 0; border-bottom: 0; }
.hud-panel::after { bottom: -1px; right: -1px; border-left: 0; border-top: 0; }
.panel-head { display: flex; justify-content: space-between; align-items: center; gap: var(--space-2);
  font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--color-text-secondary); margin-bottom: var(--space-2); }
.panel-head .meta { color: var(--color-text-muted); letter-spacing: .06em; }
.btn { background: transparent; border: 1px solid var(--color-accent); color: var(--color-accent); padding: 8px 16px;
  font: 600 13px/1 var(--font-display); letter-spacing: .14em; text-transform: uppercase;
  clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px); }
.btn:hover { background: rgb(var(--color-accent-rgb) / .14); }
.btn.primary { background: var(--color-accent); color: var(--color-accent-contrast); }
.btn.primary:hover { filter: brightness(1.12); }
.btn.quiet { border-color: var(--color-line-strong); color: var(--color-text-secondary); }
.badge { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; padding: 2px 6px; border: 1px solid currentColor; white-space: nowrap; }
.badge.safe { color: var(--color-ok); } .badge.review { color: var(--color-warn); } .badge.keep { color: var(--color-accent); }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 2px; height: 8px; }
.seg i { background: var(--color-line); }
.seg i.on { background: var(--seg-color, var(--color-accent)); box-shadow: 0 0 calc(4px * var(--glow-strength)) var(--seg-color, var(--color-accent)); }
.chk { appearance: none; width: 14px; height: 14px; margin: 0; border: 1px solid var(--color-line-strong); background: transparent; cursor: pointer; flex: none; }
.chk:checked { background: var(--color-accent); border-color: var(--color-accent); box-shadow: 0 0 calc(6px * var(--glow-strength)) rgb(var(--color-accent-rgb) / .7); }
.num { font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.path { color: var(--color-text-muted); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row { display: grid; align-items: center; gap: var(--space-3); min-height: 34px; padding: 3px var(--space-2); border-top: 1px solid var(--color-line); }
.row:hover { background: rgb(var(--color-accent-rgb) / .05); }
.row.done { opacity: .4; }
.action-footer { display: flex; align-items: center; gap: var(--space-4); margin-top: auto; padding-top: var(--space-2); border-top: 1px solid var(--color-line-strong); }
.action-footer .summary { flex: 1; color: var(--color-text-secondary); }
.action-footer .summary b { color: var(--color-text-primary); font-weight: 500; }
.field-error { color: var(--color-alert); }
.lock { width: 12px; height: 12px; fill: none; stroke: var(--color-warn); stroke-width: 1.6; vertical-align: -1px; }

/* Dashboard */
.grid-dash { display: grid; grid-template-columns: repeat(3, 172px) 1fr; gap: var(--space-3); }
.gauge { width: 100%; display: block; }
.gauge circle { fill: none; transform: rotate(135deg); transform-origin: 60px 60px; }
.gauge-ticks { stroke: var(--color-line-strong); stroke-width: 3; stroke-dasharray: .4 2.1; }
.gauge-track { stroke: var(--color-line); stroke-width: 6; }
.gauge-value { stroke: var(--color-accent); stroke-width: 6; transition: stroke-dasharray .9s cubic-bezier(.2,.8,.2,1);
  filter: drop-shadow(0 0 calc(3px * var(--glow-strength)) var(--color-accent)); }
.gauge-value.warn { stroke: var(--color-warn); filter: drop-shadow(0 0 calc(3px * var(--glow-strength)) var(--color-warn)); }
.gauge-num { font: 700 24px var(--font-display); fill: var(--color-text-primary); text-anchor: middle; }
.gauge-unit { font: 400 9px var(--font-data); fill: var(--color-text-secondary); text-anchor: middle; letter-spacing: .08em; }
.big-number { font: 700 44px/1 var(--font-display); color: var(--color-ok); letter-spacing: .04em;
  text-shadow: 0 0 calc(12px * var(--glow-strength)) color-mix(in srgb, var(--color-ok) 50%, transparent); }
.reclaim-row { display: grid; grid-template-columns: 150px 1fr 64px; gap: var(--space-3); align-items: center; padding: 5px 0;
  background: none; border: 0; border-top: 1px solid var(--color-line); width: 100%; text-align: left; font-size: 12px; }
.reclaim-row:hover { color: var(--color-accent); }
.grid-dash-2 { display: grid; grid-template-columns: 1.35fr 1fr; gap: var(--space-3); flex: 1; min-height: 0; }
.log { list-style: none; margin: 0; padding: 0; font-size: 12px; display: flex; flex-direction: column; gap: 3px; }
.log li { display: grid; grid-template-columns: 64px 56px 1fr; gap: var(--space-2); }
.log time { color: var(--color-text-muted); } .log .tag { color: var(--color-accent); } .log .tag.warn { color: var(--color-warn); }
.radar-wrap { display: grid; grid-template-columns: 150px 1fr; gap: var(--space-4); align-items: center; }
.radar { position: relative; width: 150px; aspect-ratio: 1; border-radius: 50%; border: 1px solid var(--color-line-strong); overflow: hidden;
  background: repeating-radial-gradient(circle, transparent 0 24px, rgb(var(--color-accent-rgb) / .2) 24px 25px); }
.radar::before, .radar::after { content: ""; position: absolute; background: rgb(var(--color-accent-rgb) / .2); }
.radar::before { left: 50%; top: 0; bottom: 0; width: 1px; } .radar::after { top: 50%; left: 0; right: 0; height: 1px; }
.radar-sweep { position: absolute; inset: 0; border-radius: 50%; background: conic-gradient(from 0deg, rgb(var(--color-accent-rgb) / .5), transparent 28%);
  animation: spin var(--motion-sweep-duration) linear infinite; }
.radar.fast .radar-sweep { animation-duration: 1.1s; }
@keyframes spin { to { transform: rotate(360deg); } }
.blip { position: absolute; width: 5px; height: 5px; border-radius: 50%; background: var(--color-accent); animation: blink 2s ease-in-out infinite; }
.stream { height: 54px; overflow: hidden; font-size: 11px; color: var(--color-text-muted); margin: var(--space-2) 0; }
.stream div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 2px var(--space-3); font-size: 12px; margin: 0 0 var(--space-3); }
.kv dt { color: var(--color-text-muted); } .kv dd { margin: 0; }

/* Lists */
.row.cleanup { grid-template-columns: 14px minmax(0, 1fr) 76px 150px 72px; }
.row.dev { grid-template-columns: 14px minmax(0, 1.2fr) 80px minmax(0, 1fr) 110px 76px 72px; }
.row.head { min-height: 26px; border-top: 0; font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--color-text-muted); }
.row.head:hover { background: none; }
.eco { color: var(--color-accent); }
.dup-group .row { grid-template-columns: 14px 14px minmax(0, 1fr) 96px 60px; }
.dup-node { width: 8px; height: 8px; border: 1px solid var(--color-accent); position: relative; margin-left: 3px; }
.dup-node::before { content: ""; position: absolute; left: 3px; top: -22px; height: 22px; width: 1px; background: var(--color-line-strong); }
.dup-group .row:first-of-type .dup-node::before { display: none; }
.dup-group.shake { animation: shake .3s; }
@keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
.photo-strip { display: flex; gap: var(--space-3); }
.photo { width: 168px; display: flex; flex-direction: column; gap: 5px; font-size: 11px; color: var(--color-text-secondary); }
.thumb { position: relative; height: 104px; border: 1px solid var(--color-line);
  background:
    radial-gradient(circle at var(--sun-x, 70%) 32%, rgb(var(--color-accent-rgb) / .75) 0 7%, transparent 8%),
    linear-gradient(162deg, transparent 58%, rgb(var(--color-accent-rgb) / .32) 59%),
    linear-gradient(196deg, transparent 66%, rgb(var(--color-accent-rgb) / .2) 67%),
    linear-gradient(180deg, rgb(var(--color-accent-rgb) / .2), transparent 70%), var(--color-surface-raised); }
.thumb::before, .thumb::after { content: ""; position: absolute; width: 14px; height: 14px; border: 2px solid var(--color-accent); }
.thumb::before { top: 6px; left: 6px; border-right: 0; border-bottom: 0; } .thumb::after { bottom: 6px; right: 6px; border-left: 0; border-top: 0; }
.match { position: absolute; left: 6px; bottom: 6px; background: var(--color-surface-window); color: var(--color-accent); padding: 0 4px; font-size: 10px; letter-spacing: .08em; }
.photo label { display: flex; align-items: center; gap: 6px; }
.slider-row { display: flex; align-items: center; gap: var(--space-3); }
.slider-row input { flex: 1; accent-color: var(--color-accent); }

/* Disk map */
.map-bar { display: flex; align-items: center; gap: var(--space-3); flex-wrap: wrap; }
.crumbs { display: flex; gap: 6px; align-items: center; flex: 1; min-width: 0; font-size: 12px; }
.crumbs button { background: none; border: 0; padding: 0; color: var(--color-accent); }
.crumbs span { color: var(--color-text-muted); }
.treemap { position: relative; height: 430px; border: 1px solid var(--color-line-strong); overflow: hidden; cursor: crosshair; background: var(--color-surface-window); }
.tm-layer { position: absolute; inset: 0; transform-origin: 0 0; transition: transform .45s cubic-bezier(.2,.8,.2,1), opacity .3s; }
.tm-block { position: absolute; padding: 6px 8px; font-size: 11px; overflow: hidden; border: 1px solid var(--block-color);
  background: color-mix(in srgb, var(--block-color) 14%, transparent); color: color-mix(in srgb, var(--block-color) 70%, white); }
.tm-block b { display: block; font: 600 13px/1.2 var(--font-display); letter-spacing: .08em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tm-block:hover { background: color-mix(in srgb, var(--block-color) 30%, transparent); box-shadow: inset 0 0 calc(18px * var(--glow-strength)) color-mix(in srgb, var(--block-color) 45%, transparent); }
.cross-h, .cross-v { position: absolute; background: rgb(var(--color-accent-rgb) / .55); pointer-events: none; z-index: 5; }
.cross-h { left: 0; right: 0; height: 1px; } .cross-v { top: 0; bottom: 0; width: 1px; }
.tm-card { position: absolute; z-index: 6; pointer-events: none; min-width: 190px; background: var(--color-surface-window); border: 1px solid var(--color-accent); padding: 8px 10px; font-size: 11px; }
.tm-card b { font: 600 14px var(--font-display); letter-spacing: .1em; text-transform: uppercase; color: var(--color-accent); }
.tm-sweep { position: absolute; top: 0; bottom: 0; width: 120px; pointer-events: none; z-index: 4;
  background: linear-gradient(90deg, transparent, rgb(var(--color-accent-rgb) / .3)); border-right: 1px solid var(--color-accent); animation: sweepx 1.6s linear; }
@keyframes sweepx { from { transform: translateX(-120px); } to { transform: translateX(900px); } }
.legend { display: flex; flex-wrap: wrap; gap: var(--space-4); font-size: 11px; color: var(--color-text-secondary); }
.legend i { display: inline-block; width: 9px; height: 9px; border: 1px solid var(--block-color); background: color-mix(in srgb, var(--block-color) 30%, transparent); margin-right: 6px; }

/* Monitor */
.grid-mon { display: grid; grid-template-columns: 1.5fr 1fr; gap: var(--space-3); }
.grid-mon-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--space-3); }
.scope { width: 100%; height: 150px; display: block; }
.readout { font: 700 28px/1 var(--font-display); letter-spacing: .04em; }
.readout small { font: 400 11px var(--font-data); color: var(--color-text-secondary); letter-spacing: .06em; }
.cores { display: grid; grid-template-columns: repeat(10, 1fr); gap: 5px; height: 118px; align-items: end; }
.core { display: flex; flex-direction: column; justify-content: flex-end; height: 100%; gap: 3px; font-size: 9px; color: var(--color-text-muted); text-align: center; }
.core i { display: block; background: var(--color-accent); transition: height .4s; box-shadow: 0 0 calc(5px * var(--glow-strength)) rgb(var(--color-accent-rgb) / .6); }
.core.eff i { background: var(--color-ok); }
.temp-row, .proc-row { display: grid; align-items: center; gap: var(--space-2); font-size: 12px; padding: 2px 0; }
.temp-row { grid-template-columns: 56px 1fr 44px; }
.proc-row { grid-template-columns: minmax(0, 1fr) 70px 150px 48px; border-top: 1px solid var(--color-line); padding: 5px 0; }

/* Overlays */
.overlay { position: absolute; inset: 0; z-index: 30; display: grid; place-items: center; background: rgb(0 0 0 / .66); }
.dialog { width: 460px; background: var(--color-surface-window); animation: enter .2s ease-out; }
.dialog h2 { font: 700 20px/1 var(--font-display); letter-spacing: .14em; text-transform: uppercase; margin: 0 0 var(--space-2); color: var(--color-warn); }
.dialog ul { margin: var(--space-3) 0; padding-left: 18px; color: var(--color-text-secondary); display: flex; flex-direction: column; gap: 4px; }
.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-3); margin-top: var(--space-4); }
.mac-sheet { width: 300px; border-radius: 14px; background: #ececec; color: #1d1d1f; padding: 22px 20px 16px; text-align: center;
  font: 13px/1.35 -apple-system, "Helvetica Neue", sans-serif; }
.mac-sheet svg { width: 46px; height: 46px; fill: none; stroke: #e0443e; stroke-width: 2; stroke-linecap: round; }
.mac-sheet strong { display: block; margin: 10px 0 4px; font-size: 14px; }
.mac-sheet p { margin: 0 0 14px; color: #55555a; font-size: 12px; }
.mac-sheet button { display: block; width: 100%; border: 0; border-radius: 7px; padding: 7px; margin-top: 7px; background: #dcdcdc; color: #1d1d1f; font: inherit; }
.mac-sheet button.go { background: #0a7aff; color: #fff; }
.mac-note { margin-top: var(--space-3); font-size: 11px; color: var(--color-text-muted); text-align: center; letter-spacing: .08em; text-transform: uppercase; }
.boot { position: absolute; inset: 0; z-index: 45; background: var(--color-surface-void); display: grid; place-items: center; cursor: pointer; }
.boot-inner { width: 520px; }
.boot-title { font: 700 30px/1 var(--font-display); letter-spacing: .24em; color: var(--color-accent); margin-bottom: var(--space-4);
  text-shadow: 0 0 calc(14px * var(--glow-strength)) rgb(var(--color-accent-rgb) / .7); }
.boot-lines { min-height: 118px; color: var(--color-text-secondary); font-size: 12px; white-space: pre; }
.boot-lines .ok { color: var(--color-ok); }
.boot-hint { margin-top: var(--space-3); color: var(--color-text-muted); font-size: 11px; }

/* Token sheet */
.token-sheet { border: 1px solid var(--color-line); padding: var(--space-2) var(--space-3); color: var(--color-text-secondary); }
.token-sheet summary { cursor: pointer; letter-spacing: .1em; text-transform: uppercase; font-size: 11px; }
.token-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 4px var(--space-4); margin-top: var(--space-2); font-size: 11px; }
.token-grid div { display: flex; align-items: center; gap: 8px; min-width: 0; }
.token-grid i { width: 12px; height: 12px; border: 1px solid var(--color-line-strong); flex: none; }
.token-grid code { color: var(--color-text-primary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* Motion preference */
:root[data-motion="reduced"] .ambient { animation: none !important; }
:root[data-motion="off"] *, :root[data-motion="off"] *::before, :root[data-motion="off"] *::after { animation: none !important; transition: none !important; }

  /* Squarified treemap: the same algorithm is ported to maccleaner-domain/src/treemap/squarified_layout.rs */
  function squarify(items, x, y, w, h) {
    const total = items.reduce((sum, i) => sum + i.gb, 0), out = [];
    let rest = [...items].sort((a, b) => b.gb - a.gb).map((item) => ({ item, area: item.gb / total * w * h }));
    while (rest.length) {
      const short = Math.min(w, h);
      const worst = (row) => { const s = row.reduce((a, b) => a + b.area, 0), areas = row.map((b) => b.area);
        return Math.max(short * short * Math.max(...areas) / (s * s), s * s / (short * short * Math.min(...areas))); };
      let n = 1; while (n < rest.length && worst(rest.slice(0, n + 1)) <= worst(rest.slice(0, n))) n += 1;
      const row = rest.slice(0, n), thick = row.reduce((a, b) => a + b.area, 0) / short; let offset = 0;
      row.forEach((b) => { const len = b.area / thick;
        out.push(w >= h ? { item: b.item, x, y: y + offset, w: thick, h: len } : { item: b.item, x: x + offset, y, w: len, h: thick }); offset += len; });
      if (w >= h) { x += thick; w -= thick; } else { y += thick; h -= thick; }
      rest = rest.slice(n);
    }
    return out;
  }

    let i = 0; const cells = $$('#boot-seg i', el), stepMs = parseFloat(getComputedStyle(root).getPropertyValue('--motion-boot-duration')) * 1000 / lines.length;
    const end = () => { clearInterval(timer); el.remove(); };
    const timer = setInterval(() => { $('#boot-lines', el).insertAdjacentHTML('beforeend', lines[i] + '\n'); i += 1;
      cells.forEach((c, n) => c.classList.toggle('on', n < Math.round(i / lines.length * cells.length))); if (i >= lines.length) { clearInterval(timer); setTimeout(end, 350); } }, stepMs);
    el.onclick = end;
  }

  function paintTokens() {
    const css = getComputedStyle(root), names = ['--color-surface-void', '--color-surface-window', '--color-surface-panel', '--color-surface-raised', '--color-line', '--color-line-strong',
      '--color-text-primary', '--color-text-secondary', '--color-text-muted', '--color-accent', '--color-ok', '--color-warn', '--color-alert', '--glow-strength', '--motion-sweep-duration', '--motion-boot-duration', '--motion-enter-duration'];
    $('#token-grid').innerHTML = names.map((n) => { const v = css.getPropertyValue(n).trim(); return `<div>${n.startsWith('--color') ? `<i style="background:${v}"></i>` : '<i></i>'}<code>${n}</code><span>${v}</span></div>`; }).join('');
  }
  const press = (selector, chosen) => $$(selector).forEach((c) => c.setAttribute('aria-pressed', String(c === chosen)));
  $$('[data-palette-choice]').forEach((chip) => { chip.onclick = () => { const p = chip.dataset.paletteChoice; if (p === 'agency') delete root.dataset.palette; else root.dataset.palette = p;
    press('[data-palette-choice]', chip); paintTokens(); show(current()); }; });
  $$('[data-motion-choice]').forEach((chip) => { chip.onclick = () => { root.dataset.motion = chip.dataset.motionChoice; press('[data-motion-choice]', chip); show(current()); }; });
  $('#glow-range').oninput = (e) => { root.style.setProperty('--glow-strength', e.target.value); paintTokens(); };
  const settingsToggle = $('#settings-toggle'), settingsPanel = $('#settings-panel');
  const setSettingsOpen = (open) => { settingsPanel.hidden = !open; settingsToggle.setAttribute('aria-expanded', String(open)); };
  settingsToggle.onclick = () => setSettingsOpen(settingsPanel.hidden);
  document.addEventListener('click', (e) => { if (!settingsPanel.hidden && !e.target.closest('#settings-panel, #settings-toggle')) setSettingsOpen(false); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') setSettingsOpen(false); });
  $('#replay-boot').onclick = () => { setSettingsOpen(false); boot(); };
  const current = () => $('.rail-item[aria-current="page"]')?.dataset.go || 'dashboard';

  setInterval(() => { $('#clock').textContent = new Date().toLocaleTimeString('pt-BR'); }, 1000);
  $('#clock').textContent = new Date().toLocaleTimeString('pt-BR');
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) { root.dataset.motion = 'reduced'; press('[data-motion-choice]', $('[data-motion-choice="reduced"]')); }
  paintTokens(); show('dashboard');
  if (motion() === 'full') boot();
})();
</script>
